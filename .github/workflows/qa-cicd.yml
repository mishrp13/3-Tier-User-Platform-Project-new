name: Enterprise DevOps CICD Pipeleine
on:
  push:
    branches:
       - qa
    paths:
       - client/**
       - server/**
       - .github/workflows/qa-cicd.yml
permissions: 
      contents: write
      id-token: write

jobs:
  gitleaks-scan:
      name: Gitleaks scan
      runs-on: ubuntu-latest
      steps:
         - name: checkout source code
           uses: actions/checkout@v4

         - name: Run Gitleaks scan
           run: |
             docker run --rm \
             -v "${{ github.workspace }}:/repo" \
             zricethezav/gitleaks:latest detect \
             --source=/repo \
             --report-format=json \
             --report-path=/repo/gitleaks-report.json \
             --redact \
             --exit-code 0

         - name: Upload Gitleaks report
           uses: actions/upload-artifact@v4
           with:
              name: gitleaks-report
              path: gitleaks-report.json
              if-no-files-found: warn


  checkov-terraform:
        name: Checkov Terraform scan
        runs-on: ubuntu-latest
        needs:  gitleaks-scan
        steps:
          - name: Checkout source code
            uses: actions/checkout@v4

          - name: Setup Python
            uses: actions/setup-python@v4
            with:
              python-version: "3.11"

          - name: Install Checkov
            run: pip install checkov
          - name: Run checkov Terraform scan
            run: |
              checkov -d .\
              --framework terraform \
              --output json > checkov-terraform-report.json || true

          - name: Upload checkov Terraform report
            uses: actions/upload-artifact@v4
            with:
              name: checkov-terraform-report
              path: checkov-terraform-report.json
              if-no-files-found: warn


  checkov-k8s:
        name: Checkov Kubernetes Scan
        runs-on: ubuntu-latest
        needs:  gitleaks-scan
        steps:
          - name: Checkout Source Code
            uses: actions/checkout@v4
          - name: Stepu Python
            uses: actions/setup-python@v5  
            with:
              python-version: "3.11"
          - name: Install Checkov
            run: pip install checkov
          - name: Run checkov Kubernetes scan
            run: |
             checkov -d . \
               --framework kubernetes \
               --output json > checkov-k8s-report.json || true
          - name: Upload Checkov Kubernetes Report
            uses: actions/upload-artifact@v4
            with:
              name: checkov-k8s-report
              path: chekov-k8s-rport.json
              if-no-files-found: warn

  checkov-dockerfile:
      name: Checkov Dockerfile Scan
      runs-on: ubuntu-latest
      needs: gitleaks-scan
      steps:
        - name: checkout source code
          uses: actions/checkout@v4
        - name: setup Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - name: Install checkov
          run: pip install checkov
        - name: Run checkov Dockerfile scan
          run: |
            checkov -d . \
              --framework dockerfile \
              --output json > checkov-dockerfile-report.json || true
        - name: upload checkov Dockerfile report
          uses: actions/upload-artifact@v4
          with:
            name: checkov-dockerfile-report
            path: checkov-dockerfile-report.json
            if-no-files-found: warn

  client-trivy-fs:
    name: Client Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan


    steps: 
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy Installation
        run: |
          trivy --version
          which trivy

      - name: Run Trivy FS scan on client(json)
        run: |
          trivy fs ./client \
          --format json \
          --output client-trivy-fs-report.json \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0


      - name: Run Trivy scan on client(Table)
        run: |
          trivy fs ./client \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0 > client-trivy-fs-report.txt

      - name: Upload client Trivy JSON report
        uses: actions/upload-artifact@v4
        with:
           name: client-trivy-fs-json-report
           path: client-trivy-fs-report.json
           if-no-files-found: warn

      - name: Upload client Trivy Table report
        uses: actions/upload-artifact@v4
        with:
           name: client-trivy-fs-table-report
           path: client-trivy-fs-report.txt
           if-no-files-found: warn

  
  server-trivy-fs:
    name: Server Trivy FS Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
           version: latest
           cache: true

      - name: Verify Trivy Installation
        run: |
          trivy --version
          which trivy


      - name: Run Trivy FS scan on server (JSON)
        run: |
          trivy fs ./server \
            --format json \
            --output server-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0


      - name: Run Trivy FS scan on server(Table)
        run: |
           trivy fs ./server \
           --format table \
           --severity HIGH,CRITICAL \
           --ignore-unfixed \
           --exit-code 0 > server-trivy-fs-report.txt

      - name: Upload Server Trivy JSON report
        uses: actions/upload-artifact@v4
        with:
          name: server-trivy-fs-json-report
          path: server-trivy-fs-report.json
          if-no-files-found: warn

      - name: Upload server Trivy TABLE report
        uses: actions/upload-artifact@v4
        with:
           name: server-trivy-fs-table-report
           path: server-trivy-fs-report.txt
           if-no-files-found: warn

  client-lint:
     name: Client Lint
     runs-on: ubuntu-latest
     needs:
      - client-trivy-fs
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform

     defaults:
        run:
          working-directory: client

     steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 18
            cache: npm
            cache-dependency-path: client/package-lock.json


        - name: Install client dependecies
          run: npm ci


        - name: Run client lint
          run: npm run lint --if-present
          continue-on-error: true

  server-lint:
    name: Server Lint
    runs-on: ubuntu-latest
    needs:
      - server-trivy-fs
      - checkov-k8s
      - checkov-dockerfile
      - checkov-terraform

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server lint
        run: npm run lint --if-present
        continue-on-error: true

  client-test:
    name: Client Test
    runs-on: ubuntu-latest
    needs: client-lint

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json


      - name: Install client dependencies
        run: npm ci

      - name: Run client tests
        run: npm test --if-present
        continue-on-error: true

  server-test:
    name: Server Test
    runs-on: ubuntu-latest
    needs: server-lint


    defaults:
      run:
        working-directory: server

    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test --if-present
        continue-on-error: true

  sonarqube:
    name: SonarQube analysis & quality gate check
    runs-on: ubuntu-latest
    needs: 
      - server-test
      - client-test
    steps:
     - uses: actions/checkout@v4
       with:
        fetch-depth: 0

     - name: SonarQube scan
       uses: sonarsource/sonarqube-scan-action@master
       env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


     - name: SonarQube Quality Gate check
       id: sonarqube-quality-gate-check
       continue-on-error: true
       uses: sonarsource/sonarqube-scan-action@master
       timeout-minutes: 10
       env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

     - name: "Example show SonarQube Quality gate status value "
       run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"

  client-build:
    name: client build
    runs-on: ubuntu-latest
    needs: client-test

    defaults: 
      run: 
        working-directory: client 

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package.json

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build --if-present

  docker:
    name: Docker build & push
    needs: 
      - client-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} 


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          load: true
          push: false
          tags: |
            mishrp/node-js-app:${{ github.sha }}
            mishrp/node-js-app:latest

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest
          cache: true

      - name: Verify Trivy Installation
        run: |
          trivy image mishrp/node-js-app:${{ github.sha  }}
          --format json \
          --output image-trivy-report.json \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0 > image-trivy-report.txt

      - name: Run Trivy image scan(Table)
        run : |
          trivy image mishrp/node-js-app:${{ github.sha }} \
          --format json \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0 > image-trivy-report.txt

      - name: Upload trivy image JSON report
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-jsomn-report
          path: image-trivy-report.json
          if-no-files-found: warn


      - name: Upload Trivy image Table report
        uses: actions/upload-artifact@v4
        with:
          name: image-trivy-table-report
          path: image-trivy-report.txt
          if-no-files-found: warn


      - name: Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
           mishrp/node-js-app:${{ github.sha }}
           mishrp/node-js-app:latest
            

        



    

  

  


      






  







        





              
            

        
       
      










































































































































































































































             
